name: Refresh sentiment and deploy Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
        id: pages
      - run: python build.py
        env:
          HISTORY_URL: ${{ steps.pages.outputs.base_url }}/history.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for uploaded artifact to appear in the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            if [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts | any(.name == "github-pages")') == true ]]; then
              exit 0
            fi
            sleep 2
          done
          echo "Uploaded Pages artifact did not become visible."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
