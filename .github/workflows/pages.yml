name: Refresh sentiment and deploy Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
        id: pages
      - run: python build.py
        env:
          HISTORY_URL: ${{ steps.pages.outputs.base_url }}/history.json
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        with:
          path: _site
      - name: Deploy uploaded artifact through the Pages API
        id: deployment
        run: python deploy.py
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
